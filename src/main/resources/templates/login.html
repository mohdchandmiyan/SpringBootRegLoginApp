<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

	
<head>
	
	<meta charset="ISO-8859-1">
	<title>Insert title here</title>
</head>

<body>
	
	<h2>Login here</h2>
	

	<div th:if="${errorMsg}">
		
		<h3 style="color: green;" th:text="${errorMsg}"></h3>
		
	</div>

    <form th:action="@{/loginForm}" th:object="${user}" method="post">
		
		
		Email Id : <input type="text" th:field="*{email}" /><br><br>
		Password : <input type="password" th:field="*{password}" /><br><br>
		
		<input type="submit" value="Login">
		
	</form>
	<br><br>
	
	<a th:href="@{/index}" method="get">Home</a>

<br><br>
	<a href="regPage">Register</a>
	
	
</body>

</html>
